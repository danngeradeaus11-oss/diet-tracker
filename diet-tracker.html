<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ダイエット管理</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #2d6a4f;
  --green-light: #74c69d;
  --orange: #f4a261;
  --bg: #f7f4ef;
  --surface: #ffffff;
  --border: #ddd8ce;
  --text: #1a1a2e;
  --muted: #8a8a9a;
  --label-w: 140px;
  --cell-w: 54px;
  --cell-h: 44px;
}

body {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */
header {
  background: var(--green);
  color: #fff;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 { font-size: 1.2rem; font-weight: 700; }
.header-date { font-family: 'DM Mono', monospace; font-size: 0.78rem; opacity: 0.75; }

/* LAYOUT */
.page { padding: 16px; max-width: 1400px; margin: 0 auto; }

/* CARD */
.card {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  padding: 18px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--green);
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-title::before {
  content: '';
  width: 4px; height: 14px;
  background: var(--green);
  border-radius: 2px;
}

/* WEIGHT CARD */
.weight-row { display: flex; gap: 8px; margin-bottom: 14px; }
.weight-row input {
  flex: 1;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 1rem;
  outline: none;
  background: var(--bg);
}
.weight-row input:focus { border-color: var(--green); }
.btn-green {
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 16px;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.85rem;
  cursor: pointer;
  white-space: nowrap;
}
.btn-green:active { opacity: 0.8; }
canvas#weightChart { width: 100% !important; height: 180px !important; }

/* STATS */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.stat-box-wide { grid-column: 1 / -1; }
.stat-box { background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
.stat-val { font-family: 'DM Mono', monospace; font-size: 1.3rem; color: var(--green); }
.stat-label { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

/* LEGEND */
.legend { display: flex; gap: 14px; font-size: 0.72rem; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); }
.legend-dot.done { background: var(--green-light); border-color: var(--green); }
.legend-dot.partial { background: #fef3ec; border-color: var(--orange); }

/* MONTH NAV */
.month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.month-nav button {
  width: 32px; height: 32px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  font-size: 1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.month-nav button:active { background: var(--green); color: #fff; border-color: var(--green); }
.month-label { font-family: 'DM Mono', monospace; font-size: 1rem; font-weight: 500; }

/* TABLE WRAP - horizontal scroll only */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  overflow-y: visible;
  -webkit-overflow-scrolling: touch;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
}

/* TABLE */
table {
  border-collapse: collapse;
  table-layout: fixed;
}
th, td { border: 1px solid var(--border); }

/* Label column - sticky */
th.col-label, td.col-label {
  width: var(--label-w);
  min-width: var(--label-w);
  max-width: var(--label-w);
  position: sticky;
  left: 0;
  background: var(--surface);
  z-index: 10;
  padding: 0 10px 0 14px;
}
thead th.col-label { z-index: 20; text-align: center; font-size: 0.78rem; color: var(--muted); font-weight: 400; }

/* Date columns */
th.date-th {
  width: var(--cell-w);
  min-width: var(--cell-w);
  max-width: var(--cell-w);
  text-align: center;
  padding: 6px 2px;
  background: var(--surface);
}
.date-num { font-family: 'DM Mono', monospace; font-size: 0.8rem; font-weight: 500; }
.date-dow { font-size: 0.65rem; color: var(--muted); }
.date-dow.sun { color: #e57373; }
.date-dow.sat { color: #5b8dd9; }
th.today-col { background: #f0faf5; }

/* Data cells */
td.data-cell {
  width: var(--cell-w);
  min-width: var(--cell-w);
  max-width: var(--cell-w);
  height: var(--cell-h);
  text-align: center;
  padding: 0;
  vertical-align: middle;
  cursor: pointer;
}
td.today-col { background: #f0faf5; }
td.data-cell:active { background: #e2f5ec; }

/* Row alternating bg */
tbody tr:nth-child(even) td { background: #fafaf8; }
tbody tr:nth-child(even) td.today-col { background: #f0faf5; }
tbody tr:nth-child(even) td.col-label { background: #fafaf8; }
tbody tr:nth-child(odd) td.col-label { background: var(--surface); }

/* Task label cell */
.task-label-cell { display: flex; align-items: center; height: var(--cell-h); gap: 6px; }
.task-name { font-size: 0.88rem; }
.type-badge { font-size: 0.62rem; color: var(--muted); background: var(--bg); border-radius: 4px; padding: 1px 4px; flex-shrink: 0; }

/* Check circle */
.circle {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--border);
  margin: auto;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem;
}
.circle.done { background: var(--green-light); border-color: var(--green); color: #fff; }
.circle.partial { background: #fef3ec; border-color: var(--orange); color: var(--orange); }

/* Number input in cell */
td.data-cell input {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 0.82rem;
  color: var(--green);
  outline: none;
  padding: 0;
  display: block;
  -moz-appearance: textfield;
}
td.data-cell input::-webkit-outer-spin-button,
td.data-cell input::-webkit-inner-spin-button { -webkit-appearance: none; }
td.data-cell input::placeholder { color: var(--border); }
tr.row-weight td.data-cell input { color: #555; }

/* TASK EDITOR */
.task-editor { margin-top: 8px; margin-bottom: 80px; }
details {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  overflow: hidden;
}
summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--green);
  text-transform: uppercase;
  list-style: none;
  user-select: none;
}
summary::-webkit-details-marker { display: none; }
.arrow { font-size: 0.7rem; color: var(--muted); transition: transform 0.2s; }
details[open] .arrow { transform: rotate(180deg); }
.task-list-edit { padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px; }
.task-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border-radius: 8px; padding: 7px 10px; min-width: 0;
}
.task-row input[type="text"] {
  flex: 1; min-width: 0; width: 0;
  border: none; background: transparent;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.88rem; color: var(--text); outline: none;
}
.task-row select {
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 0.72rem; padding: 4px 6px;
  color: var(--muted); background: var(--surface); outline: none; flex-shrink: 0;
}
.btn-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; flex-shrink: 0; padding: 0 2px; }
.btn-del:active { color: #e76f51; }
.btn-add {
  width: 100%; background: none;
  border: 1.5px dashed var(--border); border-radius: 8px;
  padding: 9px; color: var(--muted);
  font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 0.82rem; cursor: pointer;
}
.btn-add:active { border-color: var(--green-light); color: var(--green); }

/* FAB */
.fab {
  position: fixed; bottom: 24px; right: 20px;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--green); color: #fff; border: none;
  font-size: 1.5rem; cursor: pointer;
  box-shadow: 0 4px 18px rgba(45,106,79,0.45);
  z-index: 150; display: flex; align-items: center; justify-content: center;
}
.fab:active { transform: scale(0.95); }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 24px 24px 40px; width: 100%; max-width: 480px;
  animation: slideUp 0.22s cubic-bezier(0.34,1.3,0.64,1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
.modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
.modal-date { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }
.big-input-wrap {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--bg); border-radius: 14px; padding: 18px; margin-bottom: 20px;
}
.adj-btns { display: flex; flex-direction: column; gap: 8px; }
.adj-btns button {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--surface); font-size: 1.1rem; cursor: pointer;
}
.adj-btns button:active { background: var(--green); color: #fff; border-color: var(--green); }
#bigWeightInput {
  font-family: 'DM Mono', monospace; font-size: 3rem; font-weight: 500;
  width: 140px; text-align: center; border: none; background: transparent;
  color: var(--green); outline: none; -moz-appearance: textfield;
}
#bigWeightInput::-webkit-outer-spin-button,
#bigWeightInput::-webkit-inner-spin-button { -webkit-appearance: none; }
.big-unit { font-size: 1.4rem; color: var(--muted); font-family: 'DM Mono', monospace; }
.btn-save {
  width: 100%; background: var(--green); color: #fff; border: none;
  border-radius: 14px; padding: 16px;
  font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer;
}
.btn-save:active { opacity: 0.85; }

/* TOAST */
.toast {
  position: fixed; bottom: 96px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--green); color: #fff;
  padding: 10px 22px; border-radius: 30px;
  font-size: 0.88rem; font-weight: 700;
  opacity: 0; pointer-events: none; transition: all 0.25s;
  z-index: 300; white-space: nowrap;
  box-shadow: 0 4px 18px rgba(45,106,79,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* RESPONSIVE - side by side on tablet/desktop */
@media (min-width: 768px) {
  .two-col { display: flex; gap: 16px; align-items: flex-start; }
  .left-col { width: 280px; flex-shrink: 0; }
  .right-col { flex: 1; min-width: 0; overflow: hidden; }
}
</style>
</head>
<body>

<header>
  <h1>🌿 ダイエット管理</h1>
  <span class="header-date" id="headerDate"></span>
</header>

<div class="page">
  <div class="two-col">

    <!-- LEFT: グラフ・統計 -->
    <div class="left-col">
      <div class="card">
        <div class="card-title">体重グラフ</div>
        <canvas id="weightChart"></canvas>
        <div class="weight-row" style="margin-top:14px;">
          <input type="number" id="todayWeightInput" placeholder="今日の体重 kg" step="0.1" inputmode="decimal">
          <button class="btn-green" onclick="saveTodayWeight()">記録</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">統計</div>
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-val" id="sCurrent">—</div><div class="stat-label">現在の体重</div></div>
          <div class="stat-box"><div class="stat-val" id="sChange">—</div><div class="stat-label">今月の変化</div></div>
          <div class="stat-box"><div class="stat-val" id="sMin">—</div><div class="stat-label">最小値</div></div>
          <div class="stat-box"><div class="stat-val" id="sMax">—</div><div class="stat-label">最大値</div></div>
          <div class="stat-box"><div class="stat-val" id="sWeekAvg">—</div><div class="stat-label">今週平均</div></div>
          <div class="stat-box"><div class="stat-val" id="sLastWeek">—</div><div class="stat-label">先週比</div></div>
          <div class="stat-box stat-box-wide"><div class="stat-val" id="sStreak">—</div><div class="stat-label">連続記録日数</div></div>
        </div>
      </div>
    </div>

    <!-- RIGHT: カレンダー表 -->
    <div class="right-col">
      <div class="legend">
        <div class="legend-item"><div class="legend-dot done"></div>完了 (○)</div>
        <div class="legend-item"><div class="legend-dot partial"></div>部分 (△)</div>
        <div class="legend-item"><div class="legend-dot"></div>未実施</div>
      </div>
      <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <span class="month-label" id="monthLabel"></span>
        <button onclick="changeMonth(1)">›</button>
      </div>
      <div class="table-wrap">
        <table id="mainTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- やることリスト編集（最下部・開閉式） -->
  <div class="task-editor">
    <details>
      <summary>やることリスト編集 <span class="arrow">▼</span></summary>
      <div class="task-list-edit" id="taskListEdit"></div>
      <div style="padding: 0 16px 16px;">
        <button class="btn-add" onclick="addTask()">＋ 項目を追加</button>
      </div>
    </details>
  </div>
</div>

<!-- FAB -->
<button class="fab" onclick="openModal()">⚖</button>

<!-- モーダル -->
<div class="modal-overlay" id="modalOverlay" onclick="bgClose(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">⚖️ 今日の体重を記録</div>
    <div class="modal-date" id="modalDate"></div>
    <div class="big-input-wrap">
      <div class="adj-btns">
        <button onclick="adj(0.1)">＋</button>
        <button onclick="adj(-0.1)">－</button>
      </div>
      <input type="number" id="bigWeightInput" step="0.1" min="30" max="200" placeholder="--.-" inputmode="decimal">
      <span class="big-unit">kg</span>
    </div>
    <button class="btn-save" onclick="saveModal()">記録する</button>
  </div>
</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const STORAGE_KEY = 'dietTracker_v2';
const DOW = ['日','月','火','水','木','金','土'];
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

const DEFAULT_TASKS = [
  { id: 't1', name: 'くすり',    type: 'check' },
  { id: 't2', name: '足まわし',  type: 'check' },
  { id: 't3', name: '肩まわし',  type: 'check' },
  { id: 't4', name: '人と豆乳',  type: 'check' },
  { id: 't5', name: 'スクワット', type: 'number' },
  { id: 't6', name: '首コリ',    type: 'check' },
  { id: 't7', name: 'すた腹筋',  type: 'check' },
  { id: 't8', name: 'オガトレ',  type: 'check' },
  { id: 't9', name: '踏台昇降',  type: 'number' },
];

let state = {
  tasks: [],
  records: {},
  year: new Date().getFullYear(),
  month: new Date().getMonth(),
};

// ── ストレージ ──
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    state.tasks = s.tasks || DEFAULT_TASKS;
    state.records = s.records || {};
  } catch(e) {
    state.tasks = DEFAULT_TASKS;
    state.records = {};
  }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    tasks: state.tasks,
    records: state.records,
  }));
}

// ── 日付ヘルパー ──
function dkey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function todayKey() {
  const t = new Date();
  return dkey(t.getFullYear(), t.getMonth(), t.getDate());
}
function daysIn(y, m) { return new Date(y, m+1, 0).getDate(); }
function getDow(y, m, d) { return new Date(y, m, d).getDay(); }

// ── テーブル描画 ──
function renderTable() {
  const y = state.year, m = state.month;
  const days = daysIn(y, m);
  const tk = todayKey();

  // テーブル幅を動的に設定（ラベル列 + 日数分）
  document.getElementById('mainTable').style.width = (140 + days * 54) + 'px';

  // ヘッダー
  let head = '<tr><th class="col-label">タスク</th>';
  for (let d = 1; d <= days; d++) {
    const key = dkey(y, m, d);
    const w = getDow(y, m, d);
    const dowCls = w===0 ? 'sun' : w===6 ? 'sat' : '';
    head += `<th class="date-th${key===tk?' today-col':''}">
      <div class="date-num">${d}</div>
      <div class="date-dow ${dowCls}">${DOW[w]}</div>
    </th>`;
  }
  head += '</tr>';
  document.getElementById('tableHead').innerHTML = head;

  // ボディ
  let body = '';

  // 体重行
  body += '<tr class="row-weight"><td class="col-label"><div class="task-label-cell"><span class="task-name">⚖ 体重</span></div></td>';
  for (let d = 1; d <= days; d++) {
    const key = dkey(y, m, d);
    const val = state.records[key]?.weight ?? '';
    body += `<td class="data-cell${key===tk?' today-col':''}">
      <input type="number" step="0.1" inputmode="decimal" placeholder="—" value="${val}"
        onchange="setVal('${key}','weight',this.value)"
        onclick="event.stopPropagation()">
    </td>`;
  }
  body += '</tr>';

  // タスク行
  state.tasks.forEach(task => {
    body += `<tr><td class="col-label"><div class="task-label-cell">
      <span class="task-name">${task.name}</span>
      <span class="type-badge">${task.type==='check'?'○':'数値'}</span>
    </div></td>`;

    for (let d = 1; d <= days; d++) {
      const key = dkey(y, m, d);
      const val = state.records[key]?.[task.id];
      const todayCls = key===tk ? ' today-col' : '';

      if (task.type === 'check') {
        const cls = val===1 ? 'done' : val===0.5 ? 'partial' : '';
        const icon = val===1 ? '✓' : val===0.5 ? '△' : '';
        body += `<td class="data-cell${todayCls}" onclick="toggleCheck('${key}','${task.id}')">
          <div class="circle ${cls}">${icon}</div>
        </td>`;
      } else {
        const num = val ?? '';
        body += `<td class="data-cell${todayCls}">
          <input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="—" value="${num}"
            onchange="setVal('${key}','${task.id}',this.value)"
            onclick="event.stopPropagation()">
        </td>`;
      }
    }
    body += '</tr>';
  });

  document.getElementById('tableBody').innerHTML = body;
}

// ── データ操作 ──
function toggleCheck(key, tid) {
  if (!state.records[key]) state.records[key] = {};
  const v = state.records[key][tid];
  if (!v) state.records[key][tid] = 1;
  else if (v === 1) state.records[key][tid] = 0.5;
  else delete state.records[key][tid];
  save();
  renderTable();
}

function setVal(key, field, val) {
  if (!state.records[key]) state.records[key] = {};
  if (val === '' || val == null) delete state.records[key][field];
  else state.records[key][field] = parseFloat(val) || val;
  save();
  updateChart();
  updateStats();
}

// ── 月移動 ──
function changeMonth(delta) {
  state.month += delta;
  if (state.month > 11) { state.month = 0; state.year++; }
  if (state.month < 0)  { state.month = 11; state.year--; }
  document.getElementById('monthLabel').textContent = `${state.year}年 ${MONTHS[state.month]}`;
  renderTable();
  rebuildChart();
  updateStats();
}

// ── グラフ ──
let chart = null;

function getWeightSeries() {
  const y = state.year, m = state.month;
  const days = daysIn(y, m);
  const labels = [], data = [];
  for (let d = 1; d <= days; d++) {
    labels.push(String(d));
    const rec = state.records[dkey(y, m, d)];
    data.push(rec?.weight ?? null);
  }
  return { labels, data };
}

function rebuildChart() {
  if (chart) { chart.destroy(); chart = null; }
  const { labels, data } = getWeightSeries();
  const filled = data.filter(v => v !== null);
  const yMin = filled.length ? parseFloat((Math.min(...filled) - 0.5).toFixed(1)) : 50;
  const yMax = filled.length ? parseFloat((Math.max(...filled) + 0.5).toFixed(1)) : 80;
  const ma7 = data.map((_, i) => {
    const window = data.slice(Math.max(0,i-6), i+1).filter(v => v!==null);
    return window.length >= 3 ? parseFloat((window.reduce((a,b)=>a+b,0)/window.length).toFixed(2)) : null;
  });
  // Weekend band plugin - reads from state directly to avoid stale closure
  const weekendPlugin = {
    id: 'weekendBands',
    beforeDraw(ch) {
      try {
        const { ctx, chartArea, scales } = ch;
        if (!chartArea || !scales.x) return;
        const lbs = ch.data.labels;
        if (!lbs || !lbs.length) return;
        const cy = state.year, cm = state.month;
        const barW = lbs.length > 1
          ? Math.abs(scales.x.getPixelForValue(1) - scales.x.getPixelForValue(0))
          : 20;
        ctx.save();
        for (let i = 0; i < lbs.length; i++) {
          const d = parseInt(lbs[i]);
          const w = getDow(cy, cm, d);
          if (w !== 0 && w !== 6) continue;
          const xCenter = scales.x.getPixelForValue(i);
          ctx.fillStyle = w === 0 ? 'rgba(229,115,115,0.13)' : 'rgba(91,141,217,0.13)';
          ctx.fillRect(xCenter - barW / 2, chartArea.top, barW, chartArea.height);
        }
        ctx.restore();
      } catch(e) { /* silent */ }
    }
  };

  chart = new Chart(document.getElementById('weightChart').getContext('2d'), {
    type: 'line',
    plugins: [weekendPlugin],
    data: {
      labels,
      datasets: [
        {
          label: '体重',
          data,
          borderColor: '#2d6a4f',
          backgroundColor: 'rgba(116,198,157,0.15)',
          pointBackgroundColor: '#2d6a4f',
          pointRadius: 3,
          borderWidth: 2,
          tension: 0.35,
          spanGaps: true,
          fill: true,
        },
        {
          label: '7日平均',
          data: ma7,
          borderColor: '#e76f51',
          backgroundColor: 'transparent',
          pointRadius: 0,
          borderWidth: 2,
          borderDash: [5,3],
          tension: 0.35,
          spanGaps: true,
          fill: false,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, labels: { font: { family: 'DM Mono', size: 10 }, boxWidth: 16, padding: 8 } },
        tooltip: { callbacks: { label: c => ` ${c.parsed.y}kg` } }
      },
      scales: {
        x: {
          grid: { color: 'rgba(0,0,0,0.04)' },
          ticks: { font: { family: 'DM Mono', size: 9 }, maxTicksLimit: 10 }
        },
        y: {
          grid: { color: 'rgba(0,0,0,0.04)' },
          ticks: { font: { family: 'DM Mono', size: 10 }, callback: v => v + 'kg', maxTicksLimit: 5 },
          min: yMin,
          max: yMax,
        }
      }
    }
  });
}

function updateChart() {
  if (!chart) return rebuildChart();
  const { data } = getWeightSeries();
  const filled = data.filter(v => v !== null);
  const ma7 = data.map((_, i) => {
    const window = data.slice(Math.max(0,i-6), i+1).filter(v => v!==null);
    return window.length >= 3 ? parseFloat((window.reduce((a,b)=>a+b,0)/window.length).toFixed(2)) : null;
  });
  chart.data.datasets[0].data = data;
  chart.data.datasets[1].data = ma7;
  if (filled.length) {
    chart.options.scales.y.min = parseFloat((Math.min(...filled) - 0.5).toFixed(1));
    chart.options.scales.y.max = parseFloat((Math.max(...filled) + 0.5).toFixed(1));
  }
  chart.update();
}

// ── 統計 ──
function updateStats() {
  const { data } = getWeightSeries();
  const filled = data.filter(v => v !== null);
  const allIds = ['sCurrent','sChange','sMin','sMax','sWeekAvg','sLastWeek','sStreak'];
  if (!filled.length) {
    allIds.forEach(id => { document.getElementById(id).textContent = '—'; document.getElementById(id).style.color = ''; });
    return;
  }
  const cur = filled[filled.length-1];
  const diff = (cur - filled[0]).toFixed(1);
  document.getElementById('sCurrent').textContent = cur + 'kg';
  document.getElementById('sChange').textContent = (diff>0?'+':'') + diff + 'kg';
  document.getElementById('sChange').style.color = diff < 0 ? 'var(--green)' : '#e76f51';
  document.getElementById('sMin').textContent = Math.min(...filled) + 'kg';
  document.getElementById('sMax').textContent = Math.max(...filled) + 'kg';

  // 今週平均（月曜起点の今週）
  const now = new Date();
  const todayDow = now.getDay(); // 0=日
  const mondayOffset = todayDow === 0 ? 6 : todayDow - 1;
  const weekWeights = [];
  for (let i = mondayOffset; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    const k = dkey(d.getFullYear(), d.getMonth(), d.getDate());
    const rec = state.records[k];
    if (rec?.weight) weekWeights.push(rec.weight);
  }
  if (weekWeights.length) {
    const avg = (weekWeights.reduce((a,b)=>a+b,0)/weekWeights.length).toFixed(1);
    document.getElementById('sWeekAvg').textContent = avg + 'kg';
  } else {
    document.getElementById('sWeekAvg').textContent = '—';
  }

  // 先週比（今週平均 vs 先週平均）
  const lastWeekWeights = [];
  for (let i = mondayOffset+7; i >= mondayOffset+1; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    const k = dkey(d.getFullYear(), d.getMonth(), d.getDate());
    const rec = state.records[k];
    if (rec?.weight) lastWeekWeights.push(rec.weight);
  }
  if (weekWeights.length && lastWeekWeights.length) {
    const thisAvg = weekWeights.reduce((a,b)=>a+b,0)/weekWeights.length;
    const lastAvg = lastWeekWeights.reduce((a,b)=>a+b,0)/lastWeekWeights.length;
    const d2 = (thisAvg - lastAvg).toFixed(1);
    document.getElementById('sLastWeek').textContent = (d2>0?'+':'') + d2 + 'kg';
    document.getElementById('sLastWeek').style.color = d2 < 0 ? 'var(--green)' : '#e76f51';
  } else {
    document.getElementById('sLastWeek').textContent = '—';
    document.getElementById('sLastWeek').style.color = '';
  }

  // 連続記録日数（今日から遡る）
  let streak = 0;
  const check = new Date(now);
  while (true) {
    const k = dkey(check.getFullYear(), check.getMonth(), check.getDate());
    if (state.records[k]?.weight) {
      streak++;
      check.setDate(check.getDate() - 1);
    } else break;
  }
  document.getElementById('sStreak').textContent = streak > 0 ? streak + '日連続 🔥' : '0日';
  document.getElementById('sStreak').style.color = streak >= 7 ? '#e76f51' : streak >= 3 ? 'var(--green)' : '';
}

// ── 体重記録 ──
function saveTodayWeight() {
  const v = document.getElementById('todayWeightInput').value;
  if (!v) return;
  setVal(todayKey(), 'weight', parseFloat(v));
  document.getElementById('todayWeightInput').value = '';
  renderTable();
  showToast('✓ 体重を記録しました');
}

// ── モーダル ──
function openModal() {
  const now = new Date();
  document.getElementById('modalDate').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${DOW[now.getDay()]}）`;
  const rec = state.records[todayKey()];
  document.getElementById('bigWeightInput').value = rec?.weight || '';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('bigWeightInput').focus(), 200);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function bgClose(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
function adj(d) {
  const el = document.getElementById('bigWeightInput');
  el.value = Math.max(30, Math.min(200, Math.round(((parseFloat(el.value)||60)+d)*10)/10));
}
function saveModal() {
  const v = parseFloat(document.getElementById('bigWeightInput').value);
  if (isNaN(v)) return;
  setVal(todayKey(), 'weight', v);
  renderTable();
  closeModal();
  showToast(`✓ ${v}kg を記録しました`);
}

// ── トースト ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── タスク編集 ──
function renderTaskEditor() {
  const el = document.getElementById('taskListEdit');
  el.innerHTML = '';
  state.tasks.forEach((task, i) => {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML = `
      <input type="text" value="${task.name}" onchange="updateTaskName(${i},this.value)">
      <select onchange="updateTaskType(${i},this.value)">
        <option value="check"  ${task.type==='check' ?'selected':''}>○チェック</option>
        <option value="number" ${task.type==='number'?'selected':''}>数値</option>
      </select>
      <button class="btn-del" onclick="deleteTask(${i})">✕</button>
    `;
    el.appendChild(row);
  });
}
function updateTaskName(i, v) { state.tasks[i].name = v; save(); renderTable(); }
function updateTaskType(i, v) { state.tasks[i].type = v; save(); renderTable(); }
function deleteTask(i) { state.tasks.splice(i, 1); save(); renderTaskEditor(); renderTable(); }
function addTask() {
  state.tasks.push({ id: 'task_' + Date.now(), name: '新しいタスク', type: 'check' });
  save(); renderTaskEditor(); renderTable();
}

// ── 初期化 ──
function init() {
  load();
  const now = new Date();
  document.getElementById('headerDate').textContent =
    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${DOW[now.getDay()]}）`;
  document.getElementById('monthLabel').textContent = `${state.year}年 ${MONTHS[state.month]}`;
  renderTable();
  renderTaskEditor();
  rebuildChart();
  updateStats();
}

document.addEventListener('DOMContentLoaded', init);
</script>
